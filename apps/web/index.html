<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#13201d" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Papers" />
    <title>Paper Analyzer</title>
    <meta name="description" content="Past paper questions with answers, sources and similar questions" />
    <script>
      // Apply dark/light before first paint (no flash). Kept in sync by src/lib/theme.tsx.
      try {
        var t = localStorage.getItem("pa.theme");
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.documentElement.dataset.color = localStorage.getItem("pa.color") === "blue" ? "blue" : "teal";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root" class="flex min-h-screen flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
