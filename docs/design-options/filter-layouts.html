<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Analyzer — Design Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Figtree:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Source+Serif+4:wght@400;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #e6e8ec; color: #14161b; font-family: 'Geist', system-ui, sans-serif; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid #2447d4; outline-offset: 2px; }

/* ---------- design switcher (not part of the app) ---------- */
.switcher { position: sticky; top: 0; z-index: 100; background: #111318; color: #eef0f3; padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 4px 20px rgba(0,0,0,.25); }
.sw-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; justify-content: center; }
.sw-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #9aa0ad; margin-right: 4px; }
.sw-btn { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid #3a3f4b; background: transparent; color: #e3e5ea; font-size: 13px; white-space: nowrap; }
.sw-btn:hover { border-color: #6b7180; }
.sw-btn[aria-pressed="true"] { background: #fff; color: #111318; border-color: #fff; font-weight: 600; }
.sw-btn.view { height: 38px; font-size: 14px; padding: 0 16px; }
.sw-btn.view[aria-pressed="true"] { background: #4f6bff; border-color: #4f6bff; color: #fff; }
.sw-dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,255,255,.25); }
.sw-sep { width: 1px; height: 22px; background: #3a3f4b; margin: 0 6px; }
.desc { max-width: 1000px; margin: 14px auto 0; padding: 0 16px; text-align: center; font-size: 14px; line-height: 1.5; color: #353a45; }
.desc b { color: #111318; }
.stage { display: flex; justify-content: center; padding: 14px 16px 60px; }
@media (max-width: 760px) {
  .switcher { padding: 8px 10px; }
  .sw-row { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; scrollbar-width: none; }
  .sw-row::-webkit-scrollbar { display: none; }
  .desc { font-size: 13px; margin-top: 10px; }
  .stage { padding: 10px 8px 40px; }
}

/* ---------- the app frame ---------- */
.frame { container: app / inline-size; width: 100%; max-width: 1320px; min-height: 880px; position: relative; overflow: clip; background: var(--bg); color: var(--text); font-family: var(--font); border-radius: 16px; box-shadow: 0 24px 60px rgba(17,19,24,.18), 0 0 0 1px rgba(17,19,24,.06); transition: background .25s, color .25s; }
.frame.phone { max-width: 390px; min-height: 844px; border-radius: 32px; }

/* ---------- themes ---------- */
[data-theme="classic"]  { --bg:#ffffff; --surface:#ffffff; --surface2:#f4f5f7; --text:#14161b; --muted:#5b616e; --border:#e1e4ea; --primary:#2447d4; --primary-soft:#e9edfc; --on-primary:#fff; --good:#047857; --good-soft:#e6f5ee; --bad:#b91c1c; --bad-soft:#fdeded; --radius:14px; --font:'Geist',system-ui,sans-serif; --easy:#e3f5ec; --easy-t:#036646; --med:#fdf0de; --med-t:#9a4d07; --hard:#fde7e7; --hard-t:#a51d1d; --shadow:0 12px 32px rgba(17,19,24,.14); }
[data-theme="midnight"] { --bg:#0c0e13; --surface:#141720; --surface2:#1b1f2a; --text:#e9ebf1; --muted:#a0a7b7; --border:#2a2f3b; --primary:#93a2ff; --primary-soft:#232845; --on-primary:#0c0e13; --good:#4ade80; --good-soft:#10291b; --bad:#f87171; --bad-soft:#2e1517; --radius:14px; --font:'Geist',system-ui,sans-serif; --easy:#10291b; --easy-t:#6ee7a2; --med:#2e2310; --med-t:#f6bf6b; --hard:#2e1517; --hard-t:#fca5a5; --shadow:0 16px 40px rgba(0,0,0,.55); }
[data-theme="teal"]     { --bg:#f2f6f5; --surface:#ffffff; --surface2:#e8f0ee; --text:#0f1f1c; --muted:#4a5d59; --border:#d3e0dc; --primary:#0f6b63; --primary-soft:#dcefeb; --on-primary:#fff; --good:#166534; --good-soft:#e5f4e8; --bad:#b42318; --bad-soft:#fdecea; --radius:16px; --font:'Atkinson Hyperlegible',system-ui,sans-serif; --easy:#e5f4e8; --easy-t:#166534; --med:#fbf0dc; --med-t:#8a4b06; --hard:#fdecea; --hard-t:#a11a1a; --shadow:0 12px 32px rgba(15,31,28,.14); }
[data-theme="notebook"] { --bg:#f6f4ee; --surface:#fffdf8; --surface2:#efebe1; --text:#1e1a15; --muted:#655d50; --border:#e2dbcd; --primary:#b93d0c; --primary-soft:#fae6da; --on-primary:#fff; --good:#15703a; --good-soft:#e7f3e9; --bad:#b4231b; --bad-soft:#fbe9e7; --radius:10px; --font:'Lexend',system-ui,sans-serif; --easy:#e7f3e9; --easy-t:#15703a; --med:#f9ecd6; --med-t:#8c4a05; --hard:#fbe9e7; --hard-t:#a3201a; --shadow:0 12px 32px rgba(30,26,21,.14); }
[data-theme="reading"]  { --bg:#f4ecd8; --surface:#fbf6ea; --surface2:#efe4cc; --text:#2b2216; --muted:#6b5b45; --border:#e2d4b4; --primary:#8a4b12; --primary-soft:#f1e0c4; --on-primary:#fff; --good:#3f6b21; --good-soft:#e5ecd2; --bad:#9b2c1f; --bad-soft:#f5dfd6; --radius:12px; --font:'Source Serif 4',Georgia,serif; --easy:#e5ecd2; --easy-t:#3f6b21; --med:#f3e2c1; --med-t:#7a4a0c; --hard:#f5dfd6; --hard-t:#8f2a1d; --shadow:0 12px 32px rgba(60,40,10,.16); }
[data-theme="graphite"] { --bg:#16181d; --surface:#1e2127; --surface2:#262a32; --text:#eef0f2; --muted:#a3a9b4; --border:#323741; --primary:#c6f432; --primary-soft:#2c3318; --on-primary:#16181d; --good:#4ade80; --good-soft:#132a1c; --bad:#fb7185; --bad-soft:#331820; --radius:12px; --font:'Space Grotesk',system-ui,sans-serif; --easy:#132a1c; --easy-t:#86efac; --med:#33280f; --med-t:#fcd34d; --hard:#331820; --hard-t:#fda4af; --shadow:0 16px 40px rgba(0,0,0,.55); }
[data-theme="violet"]   { --bg:#f7f5ff; --surface:#ffffff; --surface2:#f0ecfd; --text:#1a1430; --muted:#5d5675; --border:#e2dcf5; --primary:#6d28d9; --primary-soft:#ede5fd; --on-primary:#fff; --good:#047857; --good-soft:#e6f5ee; --bad:#be123c; --bad-soft:#fdeaf0; --radius:18px; --font:'Manrope',system-ui,sans-serif; --easy:#e6f5ee; --easy-t:#047857; --med:#fdf0de; --med-t:#9a4d07; --hard:#fdeaf0; --hard-t:#9f1239; --shadow:0 14px 36px rgba(60,30,120,.16); }
[data-theme="ocean"]    { --bg:#eef6fa; --surface:#ffffff; --surface2:#e4f0f7; --text:#0b1d2a; --muted:#4b6070; --border:#d2e3ee; --primary:#0369a1; --primary-soft:#e0f0fa; --on-primary:#fff; --good:#047857; --good-soft:#e6f5ee; --bad:#b91c1c; --bad-soft:#fdeded; --radius:16px; --font:'Figtree',system-ui,sans-serif; --easy:#e6f5ee; --easy-t:#047857; --med:#fdf0de; --med-t:#9a4d07; --hard:#fdeded; --hard-t:#a51d1d; --shadow:0 14px 36px rgba(11,29,42,.14); }
[data-theme="coral"]    { --bg:#fff7f4; --surface:#ffffff; --surface2:#fdeee8; --text:#2a1712; --muted:#6e5650; --border:#f2ddd5; --primary:#c2412d; --primary-soft:#fde5de; --on-primary:#fff; --good:#15703a; --good-soft:#e7f3e9; --bad:#b4231b; --bad-soft:#fbe9e7; --radius:14px; --font:'Outfit',system-ui,sans-serif; --easy:#e7f3e9; --easy-t:#15703a; --med:#fbf0dc; --med-t:#8a4b06; --hard:#fbe9e7; --hard-t:#a3201a; --shadow:0 14px 36px rgba(42,23,18,.14); }
[data-theme="plum"]     { --bg:#fbf6fb; --surface:#ffffff; --surface2:#f6ecf6; --text:#24112a; --muted:#6a5570; --border:#ecdcee; --primary:#9b1fa6; --primary-soft:#f6e3f8; --on-primary:#fff; --good:#047857; --good-soft:#e6f5ee; --bad:#be123c; --bad-soft:#fdeaf0; --radius:16px; --font:'Nunito Sans',system-ui,sans-serif; --easy:#e6f5ee; --easy-t:#047857; --med:#fdf0de; --med-t:#9a4d07; --hard:#fdeaf0; --hard-t:#9f1239; --shadow:0 14px 36px rgba(60,10,70,.16); }
[data-theme="slate"]    { --bg:#f3f4f6; --surface:#ffffff; --surface2:#eceef2; --text:#0f172a; --muted:#545e70; --border:#dde1e8; --primary:#0f172a; --primary-soft:#e2e6ee; --on-primary:#fff; --good:#047857; --good-soft:#e6f5ee; --bad:#b91c1c; --bad-soft:#fdeded; --radius:12px; --font:'Geist',system-ui,sans-serif; --easy:#e3f5ec; --easy-t:#036646; --med:#fdf0de; --med-t:#9a4d07; --hard:#fde7e7; --hard-t:#a51d1d; --shadow:0 12px 32px rgba(15,23,42,.14); }

/* ---------- shared app pieces ---------- */
.appbar { display: flex; align-items: center; gap: 12px; height: 58px; padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
.logo { width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: var(--primary); color: var(--on-primary); flex: none; }
.appname { font-weight: 600; font-size: 16px; }
.apptitle { border-left: 1px solid var(--border); padding-left: 14px; line-height: 1.25; }
.apptitle b { display: block; font-size: 14px; }
.apptitle span { display: block; font-size: 12px; color: var(--muted); }
.icon-btn { margin-left: auto; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); display: inline-flex; align-items: center; justify-content: center; }
.body { padding: 22px 24px 40px; display: flex; flex-direction: column; gap: 14px; }
.layout { display: flex; gap: 22px; align-items: flex-start; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.side { width: 290px; flex: none; }
.muted { color: var(--muted); }
.label { font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.search { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); }
.search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 15px; }
.search:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.count { font-size: 14px; color: var(--muted); margin-right: auto; }
.count b { color: var(--text); }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); font-size: 14px; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--surface2); }
.btn:disabled { opacity: .4; }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: var(--primary); filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--primary); color: var(--on-primary); font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 12px; font-size: 13px; border: 1px solid var(--border); background: var(--surface); white-space: nowrap; transition: background .15s, border-color .15s, color .15s; }
.chip:hover { border-color: color-mix(in oklch, var(--primary) 45%, var(--border)); }
.chip.on { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.chip .n { font-size: 11.5px; opacity: .7; font-weight: 400; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.active-chip { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 5px 10px 5px 12px; background: var(--primary-soft); color: var(--primary); font-size: 13px; }
.diff-easy.on { background: var(--easy); color: var(--easy-t); border-color: transparent; }
.diff-med.on { background: var(--med); color: var(--med-t); border-color: transparent; }
.diff-hard.on { background: var(--hard); color: var(--hard-t); border-color: transparent; }
.row-btn { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; padding: 7px 8px; border-radius: 8px; text-align: left; font-size: 14px; }
.row-btn:hover { background: var(--surface2); }
.row-btn .n { margin-left: auto; font-size: 12px; color: var(--muted); }
.box { width: 17px; height: 17px; border-radius: 5px; flex: none; border: 1.5px solid var(--border); display: inline-flex; align-items: center; justify-content: center; color: var(--on-primary); }
.box.on { background: var(--primary); border-color: var(--primary); }
.radio { width: 17px; height: 17px; border-radius: 50%; flex: none; border: 1.5px solid var(--border); display: inline-flex; align-items: center; justify-content: center; }
.radio.on { border-color: var(--primary); }
.radio.on::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
.chev { width: 26px; height: 30px; border: 0; background: transparent; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; flex: none; border-radius: 6px; }
.chev svg { transition: transform .2s; }
.chev.open svg { transform: rotate(90deg); }
.subs { margin-left: 13px; padding-left: 10px; border-left: 1px solid var(--border); }
.subs .row-btn { font-size: 13.5px; padding: 5px 8px; }
select.sel { height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); padding: 0 10px; font-size: 14px; }
.yr { position: relative; height: 6px; border-radius: 6px; background: var(--surface2); margin: 10px 9px; }
.yr .fill { position: absolute; top: 0; bottom: 0; border-radius: 6px; background: var(--primary); }
.yr .th { position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; border: 2px solid var(--primary); background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.seg { display: inline-flex; padding: 3px; border-radius: 11px; background: var(--surface2); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 8px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.scrim { position: absolute; inset: 0; z-index: 30; border: 0; background: transparent; cursor: default; }
.pop { position: absolute; z-index: 31; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px; }

/* question cards */
.card { border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); overflow: hidden; }
.card-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 11px 18px; background: var(--surface2); border-bottom: 1px solid var(--border); }
.card-h b { font-size: 14px; }
.card-h .acts { display: flex; gap: 6px; margin-left: auto; align-items: center; }
.mini { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 12px; }
.mini.out { border: 1px solid var(--border); background: var(--surface); font-weight: 600; }
.mini.on { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.card-b { padding: 18px; display: flex; flex-direction: column; gap: 13px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
.qt { margin: 0; font-size: 16px; line-height: 1.65; white-space: pre-line; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 50px; padding: 8px 12px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); text-align: left; font-size: 15px; transition: background .2s, border-color .2s, opacity .2s; }
.opt:hover:not(:disabled) { border-color: color-mix(in oklch, var(--primary) 45%, var(--border)); }
.opt .l { width: 30px; height: 30px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; border: 1.5px solid var(--border); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .l { background: var(--good); border-color: var(--good); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .l { background: var(--bad); border-color: var(--bad); color: #fff; }
.opt.faded { opacity: .55; }
.fb { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-radius: 10px; padding: 9px 12px; font-size: 14px; font-weight: 600; }
.fb.ok { background: var(--good-soft); color: var(--good); }
.fb.no { background: var(--bad-soft); color: var(--bad); }
.fb button { border: 0; background: transparent; color: var(--muted); font-size: 12px; font-weight: 500; }
.ms { border: 1px solid var(--good); background: var(--good-soft); border-radius: 10px; padding: 12px 16px; font-size: 14px; line-height: 1.6; white-space: pre-line; }
.similar { border: 0; border-top: 1px solid var(--border); background: transparent; padding: 12px 0 0; color: var(--primary); font-size: 14px; font-weight: 500; display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; }
.similar:hover { text-decoration: underline; }
.sim-rows { display: grid; gap: 6px; }
.sim-row { display: grid; gap: 2px; border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 9px 12px; text-align: left; }
.sim-row:hover { background: var(--surface2); }
.sim-row b { font-size: 13.5px; }
.sim-row span { font-size: 12px; color: var(--muted); }
.sel-bar { position: sticky; bottom: 14px; display: flex; justify-content: center; padding: 0 14px 14px; z-index: 20; pointer-events: none; }
.sel-bar > div { pointer-events: auto; display: flex; align-items: center; gap: 10px; width: 100%; max-width: 520px; padding: 8px 8px 8px 18px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow); }

/* ---------- arrows + windows (in every design) ---------- */
.layer { position: fixed; inset: 0; z-index: 90; display: flex; justify-content: center; align-items: flex-start; padding: 70px 16px 24px; }
.layer .dim { position: absolute; inset: 0; border: 0; background: rgba(10,12,18,.45); cursor: default; }
.win { position: relative; width: min(780px, 100%); max-height: calc(100vh - 100px); display: flex; flex-direction: column; background: var(--surface); color: var(--text); font-family: var(--font); border-radius: calc(var(--radius) + 2px); box-shadow: 0 30px 80px rgba(0,0,0,.35); animation: rise .22s ease; }
.frame.phone .win { width: min(374px, 100%); }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.985); } }
.win-h { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
.win-h b { font-weight: 600; }
.win-body { overflow: auto; }
.win-body .card { border: 0; border-radius: 0; }
.kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 4px; border: 1px solid var(--border); border-radius: 5px; background: var(--surface2); font-size: 11px; }
.dots { display: inline-flex; gap: 5px; align-items: center; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--border); transition: background .2s, width .2s; }
.dots i.on { background: var(--primary); width: 18px; border-radius: 4px; }
.out-arrow { position: absolute; top: 230px; width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--text); box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; transition: transform .15s, opacity .15s; z-index: 2; }
.out-arrow:hover:not(:disabled) { transform: scale(1.07); }
.out-arrow:disabled { opacity: 0; pointer-events: none; }
.out-arrow.l { left: -66px; }
.out-arrow.r { right: -66px; }
.in-arrow { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); display: inline-flex; align-items: center; justify-content: center; }
.in-arrow:disabled { opacity: .35; }
.nav-bar { display: none; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); background: var(--surface); }
.nav-bar .btn { flex: 1; justify-content: center; }
.x-btn { margin-left: auto; width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
.x-btn:hover { background: var(--surface2); color: var(--text); }

/* ---------- filter designs ---------- */

const subKey = (tid, n) => `${tid}|${n}`;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

function count() {
  let base = 308;
  const subsSel = [];
  TOPICS.forEach((t) => t.subs.forEach(([n, c]) => { if (S.subs.has(subKey(t.id, n)) && !S.topics.has(t.id)) subsSel.push(c); }));
  if (S.topics.size || subsSel.length) base = TOPICS.filter((t) => S.topics.has(t.id)).reduce((a, t) => a + t.count, 0) + subsSel.reduce((a, c) => a + c, 0);
  const share = (list, set) => { const on = list.filter(([n]) => set.has(n)); return on.length ? on.reduce((a, [, c]) => a + c, 0) / 308 : 1; };
  const f = YEARS[S.year].f * share(SEASONS, S.season) * share(TYPES, S.type) * share(DIFFS, S.diff) * (S.q.trim() ? 0.06 : 1);
  return Math.max(S.q.trim() ? 1 : 0, Math.round(base * f));
}
function activeList() {
  const a = [];
  if (S.board) a.push({ label: S.board, rm: 'board' });
  if (S.level) a.push({ label: S.level, rm: 'level' });
  if (S.subject) a.push({ label: S.subject, rm: 'subject' });
  TOPICS.forEach((t) => {
    if (S.topics.has(t.id)) a.push({ label: `${t.code}. ${t.name}`, rm: `topic:${t.id}` });
    t.subs.forEach(([n]) => { if (!S.topics.has(t.id) && S.subs.has(subKey(t.id, n))) a.push({ label: n, rm: `sub:${subKey(t.id, n)}` }); });
  });
  if (S.year !== 'all') a.push({ label: `${YEARS[S.year].a} – ${YEARS[S.year].b}`, rm: 'year' });
  [['season', S.season], ['paper', S.paper], ['type', S.type], ['diff', S.diff]].forEach(([k, set]) => set.forEach((v) => a.push({ label: v, rm: `${k}:${v}` })));
  return a;
}

function qCard(q, o = {}) {
  const p = S.picked[q.id];
  const added = S.added.has(q.id);
  const opts = (q.options || []).map(([l, t]) => {
    const right = p && l === q.correct; const wrong = p === l && l !== q.correct;
    return `<button class="opt ${right ? 'right' : ''} ${wrong ? 'wrong' : ''} ${p && !right && !wrong ? 'faded' : ''}" data-act="pick" data-arg="${q.id}|${l}" ${p ? 'disabled' : ''}><span class="l">${right ? '✓' : wrong ? '✕' : l}</span>${esc(t)}</button>`;
  }).join('');
  const dc = diffCls(q.diff);
  let similar = '';

    if (o.similar === 'inline') {
      similar = `<button class="similar" data-act="ui" data-arg="simlist=${q.id}">${I.spark} Similar questions (${SIMILAR.length}) <span style="margin-left:auto">${S.ui.simlist === q.id ? '▲' : '▼'}</span></button>

    } else if (o.similar === 'sheet') {
      similar = `<button class="similar" data-act="sheetopen">${I.spark} See ${SIMILAR.length} similar questions</button>`;
    } else if (o.similar === 'none-btn') {
      similar = '';
    } else {
      similar = `<button class="similar" data-act="simopen" data-arg="0">${I.spark} Similar questions (${SIMILAR.length})</button>`;
    }
  }

    <div class="card-h"><b>${esc(q.src)}</b><span class="acts"><button class="mini">${I.page} Page ${q.page}</button><button class="mini">${I.dl} Paper</button><button class="mini out ${added ? 'on' : ''}" data-act="add" data-arg="${q.id}">${added ? '✓ Added' : '+ Add to PDF'}</button></span></div>

    <div class="win" role="dialog" aria-label="${esc(title)}">
      ${outArrows(kind, i, n)}
      <div class="win-h"><b>${esc(title)} ${i + 1} of ${n}</b>${dots(i, n)}${kbdHint()}<button class="x-btn" data-act="close" aria-label="Close">${I.x}</button></div>
      <div class="win-body">${qCard(list[i], { similar: kind === 'sim' ? false : undefined, key: list[i].id })}</div>
      ${navBar(kind, i, n)}
    </div></div>`;
}

// summary text for closed sections / tabs / pills
const sum = {
  course: () => [S.board, S.level, S.subject].filter(Boolean).pop() || 'All',
  topic: () => { const a = activeList().filter((x) => x.rm.startsWith('topic:') || x.rm.startsWith('sub:')); return a.length ? `${a[0].label.replace(/^\d\. /, '')}${a.length > 1 ? ` +${a.length - 1}` : ''}` : 'All'; },
  year: () => (S.year === 'all' ? 'All' : `${YEARS[S.year].a}–${YEARS[S.year].b}`),
  exam: () => { const n = S.season.size + S.paper.size + (S.year !== 'all' ? 1 : 0); return n ? `${n} set` : 'All'; },
  type: () => { const n = S.type.size + S.diff.size; return n ? [...S.type, ...S.diff].join(', ') : 'All'; },
};
const isSet = (k) => sum[k]() !== 'All';
const courseBody = () => `<span class="label">Board</span>${radioList('board', BOARDS, 'All boards')}<span class="label">Level</span>${radioList('level', LEVELS, 'All levels')}<span class="label">Subject</span>${radioList('subject', SUBJECTS, 'All subjects')}`;
const examBody = () => `<span class="label">Paper</span>${chipGroup('paper', PAPERS)}<span class="label">Season</span>${chipGroup('season', SEASONS)}`;
const typeBody = () => `<span class="label">Question type</span>${chipGroup('type', TYPES)}<span class="label">Difficulty</span>${diffPills()}`;

  smart() {

// ================================================================== question-view designs (5 ways × 3 themes)
const statusOf = (q) => { const p = S.picked[q.id]; return !p ? '' : p === q.correct ? 'ok' : 'no'; };
const RQ = {
  list() {
    return `${appbar()}<div class="body">${searchBox()}<div class="toolbar"><span class="count"><b>${QUESTIONS.length}</b> questions · Mechanics mix</span>${sortBtn()}</div>${QUESTIONS.map((q) => qCard(q)).join('')}</div>`;
  },
  focus() {
    const i = Math.min(S.nav.q, QUESTIONS.length - 1); const n = QUESTIONS.length;
    return `${appbar()}<div class="body">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:780px;width:100%;margin:0 auto"><b style="font-size:15px">Question ${i + 1} of ${n}</b>${dots(i, n)}${kbdHint()}</div>
      <div class="progress" style="max-width:780px;width:100%;margin:0 auto"><span style="width:${((i + 1) / n) * 100}%"></span></div>
      <div class="focus-stage">${outArrows('q', i, n)}${qCard(QUESTIONS[i], { key: QUESTIONS[i].id })}</div>
      <div style="max-width:780px;width:100%;margin:0 auto">${navBar('q', i, n)}</div>
    </div>`;
  },
  split() {
    const i = Math.min(S.nav.q, QUESTIONS.length - 1); const n = QUESTIONS.length;
    return `${appbar()}<div class="body"><div class="split">
      <div class="panel"><div style="padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between"><b style="font-size:14px">${n} questions</b><span class="muted" style="font-size:12px">${QUESTIONS.filter((q) => statusOf(q) === 'ok').length} right · ${QUESTIONS.filter((q) => statusOf(q) === 'no').length} wrong</span></div>
        <div class="qlist">${QUESTIONS.map((q, k) => `<button class="qrow ${k === i ? 'on' : ''}" data-act="goto" data-arg="q|${k}"><span class="st ${statusOf(q)}"></span><span style="min-width:0"><b>${esc(q.src.replace('Physics · ', ''))}</b><small>${esc(q.sub)} · ${esc(q.text)}</small></span><span class="tag">${q.type}</span></button>`).join('')}</div></div>
      <div style="display:grid;gap:10px"><div style="display:flex;align-items:center;gap:8px">${inArrows('q', i, n)}<b style="font-size:14px">Question ${i + 1} of ${n}</b>${kbdHint()}</div>${qCard(QUESTIONS[i], { key: QUESTIONS[i].id })}</div>
    </div></div>`;
  },
  tiles() {
    return `${appbar()}<div class="body">${searchBox()}<div class="toolbar"><span class="count"><b>${QUESTIONS.length}</b> questions · tap one to open</span>${sortBtn()}</div>
      <div class="tiles">${QUESTIONS.map((q, k) => { const dc = diffCls(q.diff); const st = statusOf(q); return `<button class="tile" data-act="tileopen" data-arg="${k}">
        <span class="tags"><span class="tag">${q.type}</span><span class="tag">${q.marks}</span><span class="tag" style="border-color:transparent;background:var(--${dc});color:var(--${dc}-t)">${q.diff}</span>${st ? `<span class="tag" style="border-color:transparent;background:var(--${st === 'ok' ? 'good' : 'bad'}-soft);color:var(--${st === 'ok' ? 'good' : 'bad'})">${st === 'ok' ? '✓ Right' : '✕ Wrong'}</span>` : ''}</span>
        <b style="font-size:13.5px">${esc(q.src.replace('Physics · ', ''))}</b>
        <span class="ex">${esc(q.text)}</span>
        <span class="ft"><span>${esc(q.sub)}</span><span>Open →</span></span></button>`; }).join('')}</div>
      ${S.open.tile ? windowLayer('tile', QUESTIONS, 'Question') : ''}</div>`;
  },
  practice() {
    const n = QUESTIONS.length; const i = S.nav.q;
    const ok = QUESTIONS.filter((q) => statusOf(q) === 'ok').length; const no = QUESTIONS.filter((q) => statusOf(q) === 'no').length;
    const done = QUESTIONS.filter((q) => (q.options ? S.picked[q.id] : S.answers[q.id])).length;
    if (i >= n) {
      return `${appbar('Practice')}<div class="body"><div class="panel summary" style="max-width:640px;margin:20px auto;width:100%">
        <span class="label">Practice finished</span><span class="big">${ok}/${QUESTIONS.filter((q) => q.options).length}</span><b style="font-size:18px">MCQs correct</b>
        <div class="score"><span class="ok">✓ ${ok} correct</span><span class="no">✕ ${no} wrong</span><span class="left">${n - done} skipped</span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn" data-act="goto" data-arg="q|0">Review answers</button><button class="btn primary" data-act="restart">Practise again</button></div></div></div>`;
    }
    const q = QUESTIONS[i]; const answered = q.options ? !!S.picked[q.id] : !!S.answers[q.id];
    return `${appbar('Practice')}<div class="body">
      <div style="max-width:780px;width:100%;margin:0 auto;display:grid;gap:10px">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><b style="font-size:15px">Question ${i + 1} of ${n}</b><div class="score" style="margin-left:auto"><span class="ok">✓ ${ok}</span><span class="no">✕ ${no}</span></div></div>
        <div class="progress"><span style="width:${(done / n) * 100}%"></span></div>
      </div>
      <div class="focus-stage">${outArrows('q', i, n + 1)}${qCard(q, { similar: false, key: q.id })}</div>
      <div style="max-width:780px;width:100%;margin:0 auto;display:flex;gap:8px;justify-content:space-between">
        <button class="btn" data-act="nav" data-arg="q|-1" ${i === 0 ? 'disabled' : ''}>${I.prev} Previous</button>
        <button class="btn ${answered ? 'primary' : ''}" data-act="nav" data-arg="q|1">${i === n - 1 ? 'Finish' : answered ? 'Next question' : 'Skip'} ${I.next}</button>
      </div>
    </div>`;
  },
};

// ================================================================== similar-question designs
const RS = {
  popup() {
    return `${appbar()}<div class="body"><div style="max-width:820px;width:100%;margin:0 auto;display:grid;gap:12px">
      <span class="muted" style="font-size:13px">Open “Similar questions” below, then pick one ↓</span>
      ${qCard(QUESTIONS[0], { similar: 'inline' })}</div>
      ${S.open.sim ? windowLayer('sim', SIMILAR, 'Similar question') : ''}</div>`;
  },
  drawer() {
    const i = S.nav.drw; const n = SIMILAR.length;
    return `${appbar()}<div class="body"><div class="with-drawer">
      ${qCard(QUESTIONS[0], { similar: false })}
      <aside class="panel sim-drawer">
        <div class="head">${I.spark}<b style="font-size:14px">Similar questions</b><span style="margin-left:auto;display:flex;gap:6px">${inArrows('drw', i, n)}</span></div>
        <div class="numtabs">${SIMILAR.map((_, k) => `<button class="${k === i ? 'on' : ''}" data-act="goto" data-arg="drw|${k}">${k + 1}</button>`).join('')}<span class="muted" style="font-size:12px;margin-left:auto;align-self:center">${i + 1} of ${n}</span></div>
        <div style="padding-top:10px">${qCard(SIMILAR[i], { similar: false, key: SIMILAR[i].id })}</div>
      </aside></div></div>`;
  },
  carousel() {
    const i = S.nav.car; const n = SIMILAR.length;
    return `${appbar()}<div class="body"><div style="max-width:860px;width:100%;margin:0 auto;display:grid;gap:16px">
      ${qCard(QUESTIONS[0], { similar: false })}
      <div class="car-head">${I.spark}<b>Similar questions</b><span class="muted" style="font-size:13px">${i + 1} of ${n}</span>${dots(i, n)}<span style="margin-left:auto;display:flex;gap:6px">${inArrows('car', i, n)}</span></div>
      <div class="carousel">${outArrows('car', i, n)}<div class="car-track"><div class="car-inner" style="transform:translateX(-${i * 100}%)">${SIMILAR.map((s) => `<div>${qCard(s, { similar: false })}</div>`).join('')}</div></div></div>
    </div></div>`;
  },
  compare() {
    const i = S.nav.cmp; const n = SIMILAR.length;
    return `${appbar()}<div class="body"><div class="compare">
      <div><div class="colh"><span class="badge" style="background:var(--surface2);color:var(--text)">This question</span></div>${qCard(QUESTIONS[0], { similar: false })}</div>
      <div><div class="colh"><span class="badge">Similar ${i + 1} of ${n}</span>${dots(i, n)}<span style="margin-left:auto;display:flex;gap:6px">${inArrows('cmp', i, n)}</span></div>${qCard(SIMILAR[i], { similar: false, key: SIMILAR[i].id })}</div>
    </div></div>`;
  },
  sheet() {
    const i = S.nav.sheet; const n = SIMILAR.length;
    return `${appbar()}<div class="body"><div style="max-width:820px;width:100%;margin:0 auto">${qCard(QUESTIONS[0], { similar: 'sheet' })}</div></div>
      ${S.open.sheet ? `<div class="layer" style="padding:0"><button class="dim" data-act="close" aria-label="Close"></button></div>
      <div class="sheet" role="dialog" aria-label="Similar questions"><div class="handle"></div>
        <div class="win-h" style="border-bottom:1px solid var(--border)">${I.spark}<b>Similar ${i + 1} of ${n}</b>${dots(i, n)}<span style="margin-left:auto;display:flex;gap:6px">${inArrows('sheet', i, n)}</span><button class="x-btn" style="margin-left:4px" data-act="close" aria-label="Close">${I.x}</button></div>
        <div class="win-body">${qCard(SIMILAR[i], { similar: false, key: SIMILAR[i].id })}</div>
      </div>` : ''}`;
  },
};

// ================================================================== render + events
const frame = document.getElementById('frame');
const current = () => (S.view === 'filters' ? FILTER_DESIGNS[S.fd] : S.view === 'question' ? QUESTION_DESIGNS[S.qd] : SIMILAR_DESIGNS[S.sd]);
function render() {
  const d = current();
  const f = document.activeElement?.dataset?.focus;
  const caret = f ? document.activeElement.selectionStart : null;
  frame.dataset.theme = S.view === 'filters' ? d.theme : S.qtheme;
  frame.className = `frame ${S.device === 'phone' ? 'phone' : ''}`;
  let html;
  if (S.view === 'filters') html = RF[d.id]() + selBar() + (S.open.sim ? windowLayer('sim', SIMILAR, 'Similar question') : '');
  else if (S.view === 'question') html = RQ[d.id]() + (S.open.sim ? windowLayer('sim', SIMILAR, 'Similar question') : '');
  else html = RS[d.id]();
  frame.innerHTML = html;

  document.getElementById('viewBtns').innerHTML = `<span class="sw-label">Show</span>` + VIEWS.map((v) => `<button class="sw-btn view" data-act="view" data-arg="${v.id}" aria-pressed="${S.view === v.id}">${v.label} (${v.n})</button>`).join('');
  const list = S.view === 'filters' ? FILTER_DESIGNS : S.view === 'question' ? QUESTION_DESIGNS : SIMILAR_DESIGNS;
  const idx = S.view === 'filters' ? S.fd : S.view === 'question' ? S.qd : S.sd;
  document.getElementById('designBtns').innerHTML = `<span class="sw-label">Design</span>` + list.map((x, i) => `<button class="sw-btn" data-act="design" data-arg="${i}" aria-pressed="${i === idx}">${x.color ? `<span class="sw-dot" style="background:${x.color}"></span>` : ''}${x.name}</button>`).join('');
  document.getElementById('extraBtns').innerHTML =
    (S.view !== 'filters' ? `<span class="sw-label">Theme</span>${Q_THEMES.map(([k, l]) => `<button class="sw-btn" data-act="qtheme" data-arg="${k}" aria-pressed="${S.qtheme === k}">${l}</button>`).join('')}<span class="sw-sep"></span>` : '') +
    `<span class="sw-label">Device</span>${[['laptop', 'Laptop'], ['phone', 'Phone']].map(([k, l]) => `<button class="sw-btn" data-act="device" data-arg="${k}" aria-pressed="${S.device === k}">${l}</button>`).join('')}`;
  document.getElementById('desc').innerHTML = d.desc + ' <span style="color:#6a707c">Everything is clickable. In every design, “Similar questions” and the ‹ › arrows (or ← → keys) step through questions.</span>';
  if (f) { const el = frame.querySelector(`[data-focus="${f}"]`); if (el) { el.focus(); if (caret != null) el.setSelectionRange(caret, caret); } }
}

function clearAll() {
  S.board = S.level = S.subject = ''; S.topics.clear(); S.subs.clear(); S.year = 'all';
  S.season.clear(); S.paper.clear(); S.type.clear(); S.diff.clear();
}
function closeAll() {
  S.open.sim = S.open.tile = S.open.sheet = false;
  S.ui.pop = S.ui.fly = S.ui.mega = S.ui.modal = S.ui.sugg = S.ui.dock = S.ui.more = '';
}
// how many steps each arrow kind has (practice mode has one extra step: the summary)
const total = (k) => (k === 'q' ? QUESTIONS.length + (S.view === 'question' && QUESTION_DESIGNS[S.qd].id === 'practice' ? 1 : 0) : k === 'tile' ? QUESTIONS.length : SIMILAR.length);
function move(k, d) { S.nav[k] = Math.max(0, Math.min(total(k) - 1, S.nav[k] + d)); }
// which list the ← → keys move right now
function activeNav() {
  if (S.open.sim) return 'sim';
  if (S.open.tile) return 'tile';
  if (S.open.sheet) return 'sheet';
  if (S.view === 'question') return ['focus', 'split', 'practice'].includes(QUESTION_DESIGNS[S.qd].id) ? 'q' : null;
  if (S.view === 'similar') return { drawer: 'drw', carousel: 'car', compare: 'cmp' }[SIMILAR_DESIGNS[S.sd].id] || null;
  return null;
}

function act(a, arg) {
  switch (a) {
    case 'view': S.view = arg; closeAll(); window.scrollTo({ top: 0 }); break;
    case 'design': closeAll(); if (S.view === 'filters') S.fd = Number(arg); else if (S.view === 'question') { S.qd = Number(arg); S.nav.q = 0; } else S.sd = Number(arg); window.scrollTo({ top: 0 }); break;
    case 'device': S.device = arg; break;
    case 'qtheme': S.qtheme = arg; break;
    case 'darkmode': S.qtheme = S.qtheme === 'midnight' ? 'classic' : 'midnight'; break;
    case 'radio': { const [k, v] = arg.split('='); S[k] = v; if (k === 'board') { S.level = S.subject = ''; } if (k === 'subject' && v) { S.board = BOARDS[0][0]; S.level = LEVELS[0][0]; } break; }
    case 'topic': { const had = S.topics.has(arg); TOPICS.find((t) => t.id === arg).subs.forEach(([n]) => S.subs.delete(subKey(arg, n))); had ? S.topics.delete(arg) : S.topics.add(arg); break; }
    case 'sub': {
      const i = arg.indexOf('|'); const tid = arg.slice(0, i); const n = arg.slice(i + 1); const t = TOPICS.find((x) => x.id === tid);
      if (S.topics.has(tid)) { S.topics.delete(tid); t.subs.forEach(([m]) => { if (m !== n) S.subs.add(subKey(tid, m)); }); }
      else toggle(S.subs, subKey(tid, n));
      if (t.subs.every(([m]) => S.subs.has(subKey(tid, m)))) { t.subs.forEach(([m]) => S.subs.delete(subKey(tid, m))); S.topics.add(tid); }
      break;
    }
    case 'exp': toggle(S.exp, arg); break;
    case 'today': toggle(S.today, arg); break;
    case 'year': S.year = arg; break;
    case 'multi': { const [k, v] = arg.split('='); toggle(S[k], v); break; }
    case 'settype': S.type.clear(); if (arg) S.type.add(arg); break;
    case 'setdiff': S.diff.clear(); if (arg) S.diff.add(arg); break;
    case 'chapter': S.ui.chapter = arg; break;
    case 'ytab': S.ui.ytab = arg; break;
    case 'clear': clearAll(); break;
    case 'rm': {
      if (['board', 'level', 'subject'].includes(arg)) S[arg] = '';
      else if (arg === 'year') S.year = 'all';
      else { const i = arg.indexOf(':'); const k = arg.slice(0, i); const v = arg.slice(i + 1); if (k === 'topic') S.topics.delete(v); else if (k === 'sub') S.subs.delete(v); else S[k].delete(v); }
      break;
    }
    case 'ui': { const [k, v] = arg.split('='); S.ui[k] = S.ui[k] === v ? '' : v; break; }
    case 'hint': S.q = arg; S.ui.sugg = 'open'; setTimeout(() => frame.querySelector('[data-focus="q"]')?.focus(), 0); break;
    case 'pick': { const [id, l] = arg.split('|'); if (!S.picked[id]) S.picked[id] = l; break; }
    case 'reset': delete S.picked[arg]; break;
    case 'ans': S.answers[arg] = !S.answers[arg]; break;
    case 'add': toggle(S.added, arg); break;
    case 'clearsel': S.added.clear(); break;
    case 'simopen': S.nav.sim = Number(arg) || 0; S.open.sim = true; break;
    case 'tileopen': S.nav.tile = Number(arg); S.open.tile = true; break;
    case 'sheetopen': S.nav.sheet = 0; S.open.sheet = true; break;
    case 'close': S.open.sim = S.open.tile = S.open.sheet = false; break;
    case 'nav': { const [k, d] = arg.split('|'); move(k, Number(d)); break; }
    case 'goto': { const [k, v] = arg.split('|'); S.nav[k] = Number(v); break; }
    case 'restart': QUESTIONS.forEach((q) => { delete S.picked[q.id]; delete S.answers[q.id]; }); S.nav.q = 0; break;
    default: return;
  }
  if (S.view === 'filters' && FILTER_DESIGNS[S.fd].id === 'smart' && ['topic', 'sub', 'year', 'multi'].includes(a)) { S.q = ''; S.ui.sugg = ''; }
  render();
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'SELECT' || el.tagName === 'INPUT') return;
  act(el.dataset.act, el.dataset.arg ?? '');
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset?.act === 'select') { const k = el.dataset.arg; S[k] = el.value; if (k === 'board') { S.level = S.subject = ''; } if (k === 'subject' && el.value) { S.board = BOARDS[0][0]; S.level = LEVELS[0][0]; } render(); }
});
document.addEventListener('input', (e) => { if (e.target.dataset?.act === 'q') { S.q = e.target.value; render(); } });
document.addEventListener('focusin', (e) => { if (e.target.dataset?.open === 'sugg' && S.ui.sugg !== 'open') { S.ui.sugg = 'open'; render(); } });
document.addEventListener('keydown', (e) => {
  const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName);
  if (e.key === 'Escape') { closeAll(); render(); return; }
  if (typing || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    const k = activeNav();
    if (k) { e.preventDefault(); move(k, e.key === 'ArrowLeft' ? -1 : 1); render(); }
  }
});
render();
</script>
</body>
</html>
